# Indian locations for NASA POWER daily weather (python -m solvia.data.download_nasa_power).
# Chosen to cover every region and climate: desert, coastal, Deccan plateau, Himalaya, north-east,
# islands, plus the places already in other datasets (Vadodara, Delhi, Kheda) for cross-checks.
# Coordinates are city centres to 2 decimals; NASA POWER's native grid is ~0.5° x 0.625°.

nasa_power:
  base_url: https://power.larc.nasa.gov/api/temporal/daily/point
  community: RE
  start: "20010101"   # CERES SYN1deg irradiance starts in 2001
  end: "20251231"
  parameters: [ALLSKY_SFC_SW_DWN, CLRSKY_SFC_SW_DWN, ALLSKY_KT, T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, RH2M, WS2M]
  out_dir: data/raw/nasa_power/india_cities

locations:
  # name: [state, region, latitude, longitude]
  # North
  delhi: [Delhi, North, 28.61, 77.21]
  chandigarh: [Chandigarh, North, 30.73, 76.78]
  amritsar: [Punjab, North, 31.63, 74.87]
  dehradun: [Uttarakhand, North, 30.32, 78.03]
