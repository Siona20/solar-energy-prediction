# Non-India points downloaded with the same parameters but their own period. The tag keeps the
# file name distinct from older raw files at the same coordinates (which are never overwritten).
extra_points:
  # UCI household, Sceaux (France): full weather set for the consumption features (2006-12 .. 2010-11)
  sceaux: {latitude: 48.78, longitude: 2.29, start: "20061201", end: "20101130", tag: full, out_dir: data/raw/nasa_power}

# 1° grid (NASA's native irradiance resolution) over south/central India for the Kaggle plant period,
# used to map where the plants' sensor irradiation best matches NASA (plant location ESTIMATE).
search_grid:
  name: plant_search_grid
  start: "20200501"
  end: "20200630"
  lat: [10, 22]      # inclusive range, 1° steps
  lon: [72, 84]
  out_dir: data/raw/nasa_power/plant_search_grid_2020
