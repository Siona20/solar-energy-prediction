[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solvia"
version = "0.1.0"
description = "SOLVIA - Smart Solar Energy Forecasting & Maintenance System"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # Line too long (handled by formatter / soft limit)
    "B008",  # Do not perform function calls in argument defaults
    "E402",  # Module level import not at top of file
]
